<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="'Helvetica Neue',Arial,'Liberation Sans',sans-serif" role="img" aria-labelledby="title description">
  <title id="title">proofreader_evolve in three steps</title>
  <desc id="description">Step 1: a frozen detector enumerates split candidates (fragment pairs) and merge candidates (junction nodes) from the fragment graph alone; the pool and its detector scores are fixed. Step 2: the initial policy is the detector's own ranking; AutoDiscovery hypotheses supplied the detector's features and model. Step 3: an agent reads TRAIN features, bounded labelled examples and on-demand local context, and rewrites the scorer, trains classifiers or adds descriptor columns. The host scores hidden brains and promotes only gains beyond resampling noise; the accepted scorer becomes the next parent.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
    <marker id="arrow-indigo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#6366f1"/></marker>
    <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3.5 L0,7 z" fill="#3b82f6"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .h1 { font-size: 36px; font-weight: 700; fill: #0f172a; }
      .h2 { font-size: 18px; fill: #64748b; }
      .t { font-size: 15px; fill: #475569; }
      .ts { font-size: 13px; fill: #64748b; }
      .tb { font-size: 13px; font-weight: 700; fill: #334155; }
      .node-title { font-size: 20px; font-weight: 700; }
      .badge { font-size: 17px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .code { font-family: monospace; font-size: 14px; fill: #3730a3; }
      .flow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #3b82f6; stroke-width: 1.6; marker-end: url(#arrow-blue); }
      .loop { fill: none; stroke: #16a34a; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrow-green); }
      .frag { fill: none; stroke: #64748b; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .brain { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; }
      .callout-link { fill: none; stroke: #6366f1; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-indigo); }
    </style>
  </defs>

  <rect width="1600" height="800" fill="#f8fafc"/>

  <!-- header -->
  <text x="60" y="64" class="h1">proofreader_evolve in three steps</text>
  <text x="60" y="96" class="h2">Fragments define the candidates, the frozen detector defines the starting order, an agent evolves the re-ranking behind a hidden-validation gate.</text>
  <g font-size="15" fill="#334155">
    <rect x="1215" y="48" width="24" height="16" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="1247" y="61">frozen / fixed</text>
    <rect x="1360" y="48" width="24" height="16" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="1392" y="61">agent</text>
    <rect x="1462" y="48" width="24" height="16" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1494" y="61">host</text>
  </g>

  <!-- ===== 1. candidates from fragments ===== -->
  <g transform="translate(60,130)">
    <rect x="0" y="0" width="440" height="360" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="30" cy="34" r="15" fill="#0f172a"/><text x="30" y="40" class="badge">1</text>
    <text x="56" y="40" class="node-title" fill="#0f172a">Candidates from fragments</text>

    <!-- fragment graph cartoon -->
    <path d="M26 110 L70 122 L118 114 L146 122" class="frag"/>
    <path d="M186 118 L226 108 L262 116" class="frag"/>
    <path d="M30 160 L62 172" class="frag"/>
    <path d="M40 252 L92 236 L150 256 L210 246" class="frag"/>
    <path d="M92 236 L104 196" class="frag"/>
    <path d="M232 190 L270 180" class="frag"/>
    <ellipse cx="166" cy="120" rx="40" ry="22" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 4"/>
    <circle cx="146" cy="122" r="5" fill="#d97706"/><circle cx="186" cy="118" r="5" fill="#d97706"/>
    <text x="166" y="82" class="tb" text-anchor="middle" fill="#92400e">split = fragment pair</text>
    <circle cx="92" cy="236" r="22" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
    <circle cx="92" cy="236" r="6" fill="#dc2626"/>
    <text x="92" y="288" class="tb" text-anchor="middle" fill="#991b1b">merge = junction</text>
    <text x="150" y="326" class="ts" text-anchor="middle">fragments only · no ground truth</text>

    <!-- frozen detector -> pool table -->
    <path d="M276 190 H304" class="flow"/>
    <rect x="306" y="100" width="124" height="52" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="368" y="121" class="tb" text-anchor="middle">candidate rule</text>
    <text x="368" y="139" class="ts" text-anchor="middle">gap · degree · NMS</text>
    <path d="M368 152 V172" class="flow"/>
    <g transform="translate(316,176)">
      <rect x="0" y="0" width="104" height="112" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <g fill="#cbd5e1">
        <rect x="8" y="10" width="88" height="6"/><rect x="8" y="26" width="88" height="6"/><rect x="8" y="42" width="88" height="6"/>
        <rect x="8" y="58" width="88" height="6"/><rect x="8" y="74" width="88" height="6"/><rect x="8" y="90" width="88" height="6"/>
      </g>
    </g>
    <text x="368" y="310" class="tb" text-anchor="middle">fixed pool</text>
    <text x="368" y="328" class="ts" text-anchor="middle">rows only, no order yet</text>
  </g>

  <path d="M500 310 H556" class="flow"/>

  <!-- ===== 2. initial policy ===== -->
  <g transform="translate(560,130)">
    <rect x="0" y="0" width="440" height="360" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="30" cy="34" r="15" fill="#0f172a"/><text x="30" y="40" class="badge">2</text>
    <text x="56" y="40" class="node-title" fill="#0f172a">p₀ = the detector's order</text>

    <!-- AutoDiscovery -> detector -> ranked list -->
    <g transform="translate(24,86)">
      <rect x="0" y="0" width="112" height="66" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <line x1="14" y1="18" x2="98" y2="18" stroke="#d97706" stroke-width="3"/>
      <line x1="14" y1="34" x2="78" y2="34" stroke="#d97706" stroke-width="3" opacity="0.6"/>
      <line x1="14" y1="50" x2="88" y2="50" stroke="#d97706" stroke-width="3" opacity="0.6"/>
    </g>
    <text x="80" y="176" class="tb" text-anchor="middle" fill="#92400e">AutoDiscovery</text>
    <text x="80" y="194" class="ts" text-anchor="middle">validated hypotheses</text>
    <path d="M140 119 H170" class="flow"/>
    <rect x="174" y="96" width="124" height="46" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="236" y="115" class="tb" text-anchor="middle">frozen detector</text>
    <text x="236" y="133" class="ts" text-anchor="middle">features + model</text>
    <path d="M298 119 H328" class="flow"/>
    <g transform="translate(332,80)">
      <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5">
        <rect x="0" y="0" width="84" height="18" rx="3"/><rect x="0" y="22" width="84" height="18" rx="3"/><rect x="0" y="44" width="84" height="18" rx="3"/>
        <rect x="0" y="66" width="84" height="18" rx="3"/><rect x="0" y="88" width="84" height="18" rx="3"/><rect x="0" y="110" width="84" height="18" rx="3"/>
        <rect x="0" y="132" width="84" height="18" rx="3"/><rect x="0" y="154" width="84" height="18" rx="3"/>
      </g>
      <g fill="#6366f1">
        <rect x="6" y="5" width="72" height="8"/><rect x="6" y="27" width="62" height="8"/><rect x="6" y="49" width="54" height="8"/>
        <rect x="6" y="71" width="44" height="8"/><rect x="6" y="93" width="34" height="8"/><rect x="6" y="115" width="24" height="8"/>
        <rect x="6" y="137" width="14" height="8"/><rect x="6" y="159" width="8" height="8"/>
      </g>
      <path d="M92 0 H98 V84 H92" fill="none" stroke="#0f172a" stroke-width="2"/>
    </g>
    <text x="374" y="272" class="tb" text-anchor="middle">Top-K</text>

    <!-- seed scorer -->
    <rect x="24" y="236" width="302" height="40" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="36" y="261" class="code">return features["detector_score"]</text>
    <text x="169" y="300" class="ts" text-anchor="middle">generation 0 reproduces the detector</text>
    <text x="220" y="336" class="ts" text-anchor="middle">objective: Precision@K, K = 2000 per brain and kind</text>
  </g>

  <path d="M1000 310 H1056" class="flow"/>

  <!-- ===== 3. agent evolves ===== -->
  <g transform="translate(1060,130)">
    <rect x="0" y="0" width="480" height="360" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="30" cy="34" r="15" fill="#0f172a"/><text x="30" y="40" class="badge">3</text>
    <text x="56" y="40" class="node-title" fill="#1e3a8a">Agent evolves the re-ranking</text>

    <!-- inputs row -->
    <g transform="translate(62,64)">
      <rect x="0" y="0" width="56" height="44" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <g stroke="#cbd5e1" stroke-width="1.5"><line x1="0" y1="12" x2="56" y2="12"/><line x1="0" y1="24" x2="56" y2="24"/><line x1="0" y1="36" x2="56" y2="36"/><line x1="20" y1="0" x2="20" y2="44"/><line x1="38" y1="0" x2="38" y2="44"/></g>
      <text x="28" y="64" class="tb" text-anchor="middle">TRAIN feature table</text>
      <text x="28" y="80" class="ts" text-anchor="middle">all candidates</text>
    </g>
    <g transform="translate(212,64)">
      <circle cx="10" cy="12" r="6" fill="#16a34a"/><circle cx="28" cy="12" r="6" fill="#16a34a"/><circle cx="46" cy="12" r="6" fill="#dc2626"/>
      <circle cx="10" cy="32" r="6" fill="#dc2626"/><circle cx="28" cy="32" r="6" fill="#16a34a"/><circle cx="46" cy="32" r="6" fill="#dc2626"/>
      <text x="28" y="64" class="tb" text-anchor="middle">labelled examples</text>
      <text x="28" y="80" class="ts" text-anchor="middle">a few, TRAIN only</text>
    </g>
    <g transform="translate(362,64)">
      <rect x="0" y="0" width="56" height="44" rx="5" fill="#0f172a"/>
      <circle cx="28" cy="22" r="16" fill="#334155"/>
      <path d="M6 30 L22 22 L36 24 L50 14" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
      <text x="28" y="64" class="tb" text-anchor="middle">local context</text>
      <text x="28" y="80" class="ts" text-anchor="middle">on demand · band + 3D</text>
    </g>
    <path d="M90 152 L212 194" class="thin"/>
    <path d="M240 152 V194" class="thin"/>
    <path d="M390 152 L268 194" class="thin"/>

    <!-- agent glyph -->
    <g transform="translate(204,198)">
      <rect x="0" y="0" width="72" height="64" rx="14" fill="#3b82f6"/>
      <circle cx="24" cy="26" r="7" fill="#ffffff"/><circle cx="48" cy="26" r="7" fill="#ffffff"/>
      <circle cx="25" cy="27" r="3" fill="#1e3a8a"/><circle cx="49" cy="27" r="3" fill="#1e3a8a"/>
      <rect x="22" y="44" width="28" height="6" rx="3" fill="#ffffff"/>
    </g>
    <text x="292" y="226" class="tb" fill="#1e3a8a">fresh session</text>
    <text x="292" y="244" class="ts">per generation · one kind</text>

    <path d="M232 264 L100 290" class="thin"/>
    <path d="M240 264 V290" class="thin"/>
    <path d="M248 264 L380 290" class="thin"/>

    <!-- outputs row -->
    <g transform="translate(60,294)">
      <rect x="0" y="0" width="60" height="40" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
      <text x="30" y="25" class="code" text-anchor="middle">score()</text>
      <text x="30" y="58" class="ts" text-anchor="middle">new scorer</text>
    </g>
    <g transform="translate(210,294)">
      <circle cx="30" cy="8" r="6" fill="#6366f1"/><circle cx="14" cy="32" r="6" fill="#6366f1"/><circle cx="46" cy="32" r="6" fill="#6366f1"/>
      <line x1="30" y1="8" x2="14" y2="32" stroke="#6366f1" stroke-width="2"/><line x1="30" y1="8" x2="46" y2="32" stroke="#6366f1" stroke-width="2"/>
      <text x="30" y="58" class="ts" text-anchor="middle">trained classifier</text>
    </g>
    <g transform="translate(360,294)">
      <rect x="0" y="0" width="60" height="40" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <rect x="40" y="0" width="20" height="40" fill="#bfdbfe"/>
      <text x="50" y="26" class="tb" text-anchor="middle" fill="#1e3a8a">+</text>
      <text x="30" y="58" class="ts" text-anchor="middle">new descriptor columns</text>
    </g>
  </g>

  <!-- agent -> host -->
  <path d="M1300 490 V528" class="flow"/>
  <text x="1312" y="515" class="ts">submitted scorer</text>

  <!-- ===== host gate ===== -->
  <g transform="translate(1060,532)">
    <rect x="0" y="0" width="480" height="132" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <text x="22" y="32" class="node-title" fill="#166534">Host measures and promotes</text>
    <g transform="translate(30,54)">
      <ellipse cx="26" cy="22" rx="24" ry="16" class="brain" stroke-dasharray="5 4"/>
      <ellipse cx="78" cy="22" rx="24" ry="16" class="brain" stroke-dasharray="5 4"/>
      <ellipse cx="130" cy="22" rx="24" ry="16" class="brain" stroke-dasharray="5 4"/>
      <text x="78" y="62" class="ts" text-anchor="middle">hidden validation brains</text>
    </g>
    <g transform="translate(212,44)">
      <rect x="0" y="34" width="26" height="30" fill="#94a3b8"/>
      <rect x="44" y="20" width="26" height="44" fill="#16a34a"/>
      <line x1="-8" y1="64" x2="80" y2="64" stroke="#334155" stroke-width="2"/>
      <text x="13" y="80" class="ts" text-anchor="middle">parent</text>
      <text x="57" y="80" class="ts" text-anchor="middle">new</text>
    </g>
    <text x="312" y="76" class="tb" fill="#166534">gain beyond noise</text>
    <text x="312" y="96" class="ts">bootstrap LB &gt; 0 → promote</text>
  </g>

  <!-- host -> agent loop -->
  <path d="M1060 598 H1020 V420 H1046" class="loop"/>
  <text x="1030" y="508" class="ts">accepted scorer</text>
  <text x="1030" y="524" class="ts">→ next parent</text>

  <!-- ===== callout: the candidate rule of block 1 in a little more detail ===== -->
  <path d="M430 520 V494" class="callout-link"/>
  <g transform="translate(60,520)">
    <rect x="0" y="0" width="900" height="196" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="20" y="28" class="tb" fill="#3730a3">The candidate rule of block 1, a little closer</text>
    <!-- merge: junction anchors -->
    <text x="20" y="56" class="tb">merge: junction anchors</text>
    <path d="M24 108 L70 96 L124 110" class="frag"/>
    <path d="M70 96 L84 66" class="frag"/>
    <circle cx="70" cy="96" r="6" fill="#dc2626"/>
    <circle cx="106" cy="106" r="5" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 2"/>
    <line x1="70" y1="126" x2="106" y2="126" stroke="#64748b" stroke-width="1.5"/>
    <line x1="70" y1="122" x2="70" y2="130" stroke="#64748b" stroke-width="1.5"/><line x1="106" y1="122" x2="106" y2="130" stroke="#64748b" stroke-width="1.5"/>
    <text x="88" y="144" class="ts" text-anchor="middle">20 µm</text>
    <text x="150" y="82" class="ts">anchor = fragment node with degree ≥ 3</text>
    <text x="150" y="102" class="ts">one anchor per 20 µm within a segment (NMS)</text>
    <text x="150" y="122" class="ts">positive = GT merge site within 20 µm</text>
    <!-- split: tip-to-node pairs -->
    <text x="440" y="56" class="tb">split: tip-to-node pairs</text>
    <path d="M444 110 L482 102 L510 104" class="frag"/>
    <circle cx="510" cy="104" r="36" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="510" cy="104" r="5" fill="#d97706"/>
    <path d="M524 78 L542 86 L556 100" class="frag"/>
    <path d="M522 128 L540 134 L562 128" class="frag"/>
    <circle cx="532" cy="81" r="4" fill="#d97706"/><circle cx="530" cy="131" r="4" fill="#d97706"/>
    <line x1="510" y1="104" x2="532" y2="81" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="510" y1="104" x2="530" y2="131" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="510" y="154" class="ts" text-anchor="middle">50 µm</text>
    <text x="590" y="82" class="ts">anchor = fragment tip</text>
    <text x="590" y="102" class="ts">partners = other segments within 50 µm</text>
    <text x="590" y="122" class="ts">nearest 2 kept → (tip, partner) pairs</text>
    <text x="450" y="172" class="ts" text-anchor="middle" fill="#3730a3">chosen offline by the candidate-pool sweeps: fewest candidates with worst-brain recall ≥ 0.80 (merge) / 0.90 (split)</text>
    <text x="450" y="188" class="ts" text-anchor="middle" fill="#3730a3">ground truth is used only for that choice, never inside the rule</text>
  </g>

  <!-- footer -->
  <rect x="60" y="736" width="1480" height="40" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="330" y="762" class="t" text-anchor="middle">fixed: candidate pools · K = 2000 · detectors</text>
  <text x="800" y="762" class="t" text-anchor="middle">evolved: the re-ranking and new features</text>
  <text x="1270" y="762" class="t" text-anchor="middle">judge: hidden brains the agent never sees</text>
</svg>
