<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280" font-family="'Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Proofreader scorer evolution</title>
  <desc id="description">Fixed-pool proofreader_evolve workflow. Frozen detectors and default TRAIN use 794495. Automatically select other eligible local brains with complete matching prepared tables for development validation, then freeze the split for this run. Immutable native candidates, features and labels are prepared once. Initialize the accepted scorer and a TRAIN-only branch pool. Each generation selects one active kind, an exploration branch and explore or tune mode. The agent writes a formula or training.py fit/predict program with parameters in proposal.json, with rules.md recording the hypothesis and observations. Zero-argument evaluate_train and search_parameters tools measure formulas in isolated workers; train_classifier runs agent-authored fit/predict code in Landlock and seccomp workers using TRAIN labels only, stores hashed model artifacts, and measures its in-sample TRAIN ranking. Parameter search restores the best successful TRAIN mean. Tune mode fixes the formula/program AST and nonnumeric settings. Budget: 8 new configurations plus one execution-error repair; cached scores and proposal-format errors cost no scoring budget. Restore measured snapshots by short ID. Keep up to 5 distinct Top-K branches within 0.02 absolute TRAIN precision of the champion. Explore every third measured round; after 2 stagnant measured rounds force exploration, then pause a kind after 2 unsuccessful forced explorations. All kinds paused ends the run. The final source, parameters and artifact hashes must match a successful measurement. Evaluate the final candidate once on every selected validation brain regardless of TRAIN gain. Average merge/split Precision at K within each brain, then average brains equally. Promote only if the validation mean exceeds the accepted parent's mean by more than the configured margin. Individual brain/kind regressions are allowed. Validation remains hidden adaptive development data, not an untouched final test. Save the resolved split, exclusions, gate rule, per-brain results, hypotheses, parameters, branch ancestry, Top-K changes, observable trajectories, costs and stop reason.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#64748b"/>
    </marker>
    <marker id="reject-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .heading { font-size: 23px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 17px; fill: #475569; }
      .note { font-size: 15px; fill: #64748b; }
      .code { font-family: monospace; font-size: 16px; fill: #3730a3; }
      .agent-title { fill: #1e3a8a; }
      .compute-title { fill: #166534; }
      .contract-title { fill: #3730a3; }
      .step { font-size: 19px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .reject { fill: none; stroke: #d97706; stroke-width: 2.5; marker-end: url(#reject-arrow); }
    </style>
  </defs>

  <rect width="1920" height="1280" fill="#f8fafc"/>

  <!-- Typography, palette and card treatment follow the agentic workflow figures. -->
  <text x="80" y="82" font-size="42" font-weight="700" fill="#0f172a">Proofreader scorer evolution</text>
  <text x="80" y="122" font-size="22" fill="#64748b">Improve Precision@K through measured TRAIN experiments on immutable detector-native candidates</text>
  <g id="legend">
    <rect x="1440" y="68" width="28" height="20" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="1480" y="85" font-size="17" fill="#334155">agent proposes</text>
    <rect x="1660" y="68" width="28" height="20" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="1700" y="85" font-size="17" fill="#334155">driver computes</text>
  </g>

  <!-- Immutable benchmark and editable scorer/training artifacts. -->
  <rect x="60" y="150" width="1800" height="38" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="590" y1="157" x2="590" y2="181" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="1130" y1="157" x2="1130" y2="181" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="82" y="175" font-size="16" font-weight="700" fill="#0f172a">FROZEN</text>
  <text x="172" y="175" font-size="16" fill="#334155">pool · features · labels · detector · K</text>
  <text x="612" y="175" font-size="16" font-weight="700" fill="#0f172a">EDITABLE</text>
  <text x="720" y="175" font-size="16" fill="#334155">scorer / training.py · rules · proposal</text>
  <text x="1152" y="175" font-size="16" font-weight="700" fill="#0f172a">EVALUATION</text>
  <text x="1288" y="175" font-size="16" fill="#334155">TRAIN exploration → mean validation gate</text>

  <text x="60" y="219" font-size="17" font-weight="700" fill="#334155">PREPARE ONCE, THEN INITIALIZE · no LLM calls</text>
  <text x="1860" y="219" font-size="15" text-anchor="end" fill="#64748b">Exact detector definitions; no repair-site approximation</text>

  <!-- NativeTable preparation: native_pool.py and precompute_error_scores.py. -->
  <g id="frozen-inputs" data-box="60 240 350 180">
    <rect x="60" y="240" width="350" height="180" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="96" cy="278" r="21" fill="#0f172a"/>
    <text x="96" y="285" class="step">0</text>
    <text x="132" y="286" class="heading">Frozen inputs</text>
    <text x="84" y="321" class="body">autodiscovery-application/</text>
    <text x="84" y="347" class="body">One merge + one split detector</text>
    <text x="84" y="373" class="body">Frozen models fitted on 794495</text>
    <text x="84" y="400" class="note">Defaults; matching labeled _add.pkl caches</text>
  </g>
  <path d="M412 330 H447" class="flow"/>

  <g id="native-preparation" data-box="455 240 395 180">
    <rect x="455" y="240" width="395" height="180" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="491" cy="278" r="21" fill="#0f172a"/>
    <text x="491" y="285" class="step">1</text>
    <text x="527" y="286" class="heading compute-title">Prepare native pools</text>
    <text x="479" y="321" class="body">Merge junctions · split segment pairs</text>
    <text x="479" y="347" class="body">Preserve native rows + occurrences</text>
    <text x="479" y="373" class="body">Extract features; apply frozen model</text>
    <text x="479" y="400" class="note">TRAIN 794495 · other ready brains for validation</text>
  </g>
  <path d="M852 330 H887" class="flow"/>

  <g id="frozen-tables" data-box="895 240 475 180">
    <rect x="895" y="240" width="475" height="180" rx="20" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="931" cy="278" r="21" fill="#0f172a"/>
    <text x="931" y="285" class="step">2</text>
    <text x="967" y="286" class="heading contract-title">Freeze evaluation contract</text>
    <text x="919" y="321" class="body">Predictors → fit / prediction workers</text>
    <text x="919" y="347" class="body">TRAIN labels → fit; IDs stay in evaluator</text>
    <text x="919" y="373" class="body">Validation labels → outer evaluator only</text>
    <text x="919" y="400" class="note">Fixed K + pools; verify data, code and model hashes</text>
  </g>
  <path d="M1372 330 H1407" class="flow"/>

  <g id="initialize-parent" data-box="1415 240 445 180">
    <rect x="1415" y="240" width="445" height="180" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="1451" cy="278" r="21" fill="#0f172a"/>
    <text x="1451" y="285" class="step">3</text>
    <text x="1487" y="286" class="heading compute-title">Initialize parent</text>
    <text x="1439" y="321" class="body">Seed defaults to detector_score ranking</text>
    <text x="1439" y="347" class="body">Evaluate seed on TRAIN + validation</text>
    <text x="1439" y="373" class="body">Save separate frozen-score comparator</text>
    <text x="1439" y="400" class="note">Record exclusions; freeze eligible disjoint splits</text>
  </g>

  <!-- Distinct regions for the LLM's TRAIN search and the outer selection gates. -->
  <rect x="44" y="504" width="892" height="380" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="984" y="504" width="892" height="380" rx="24" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>

  <!-- Seed enters the first generation; the long connector stays outside cards. -->
  <path d="M1640 421 V444 H24 V628 H58" class="flow"/>
  <rect x="736" y="432" width="448" height="24" rx="6" fill="#f8fafc"/>
  <text x="960" y="450" font-size="15" text-anchor="middle" fill="#64748b">Seed scorer becomes the initial accepted parent</text>

  <text x="60" y="485" font-size="22" font-weight="700" fill="#1e3a8a">WITHIN EACH GENERATION · fresh LLM session</text>
  <text x="1000" y="485" font-size="22" font-weight="700" fill="#166534">OUTER EVALUATOR · after the LLM session ends</text>

  <!-- Fresh SDK session: scorer.py, training.py, rules.md and proposal.json writable. -->
  <g id="revise-scorer" data-box="60 530 390 250">
    <rect x="60" y="530" width="390" height="250" rx="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="96" cy="568" r="21" fill="#0f172a"/>
    <text x="96" y="575" class="step">4</text>
    <text x="132" y="576" class="heading agent-title">Propose + revise</text>
    <text x="84" y="613" class="body">Edit one kind; harness freezes the other</text>
    <text x="84" y="641" class="body">TRAIN feedback + installed dependencies</text>
    <text x="84" y="669" class="body">Write formula / fit + predict code</text>
    <text x="84" y="697" class="body">proposal.json: hypothesis + params / grid</text>
    <text x="84" y="725" class="body">Choose model, preprocessing and loss</text>
    <text x="84" y="755" class="note">No model whitelist; installed CPU libraries</text>
  </g>
  <path d="M452 648 H522" class="flow"/>
  <text x="490" y="634" font-size="14" text-anchor="middle" fill="#64748b">tool call</text>

  <!-- fixed_pool_scoring.py: score all rows, always select min(K, pool size). -->
  <g id="train-experiments" data-box="530 530 390 250">
    <rect x="530" y="530" width="390" height="250" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="566" cy="568" r="21" fill="#0f172a"/>
    <text x="566" y="575" class="step">5</text>
    <text x="602" y="576" class="heading compute-title">Measure on TRAIN</text>
    <text x="554" y="613" class="body">TRAIN X + y → fit() in isolated worker</text>
    <text x="554" y="641" class="body">Saved model files → predict(X)</text>
    <text x="554" y="669" class="body">TRAIN Precision@K + Top-K changes</text>
    <text x="554" y="697" class="body">8 configurations + 1 scorer repair</text>
    <text x="554" y="725" class="body">Restore code, parameters + model by ID</text>
    <text x="554" y="755" class="note">Fitted TRAIN metric: in-sample; cache hits free</text>
  </g>
  <path d="M922 648 H992" class="flow"/>
  <text x="960" y="634" font-size="14" text-anchor="middle" fill="#64748b">submit</text>

  <g id="validation-gate" data-box="1000 530 390 250">
    <rect x="1000" y="530" width="390" height="250" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="1036" cy="568" r="21" fill="#0f172a"/>
    <text x="1036" y="575" class="step">6</text>
    <text x="1072" y="576" class="heading compute-title">Submit + validate</text>
    <text x="1024" y="613" class="body">Check measured code + params + files</text>
    <text x="1024" y="641" class="body">TRAIN gain is diagnostic only</text>
    <text x="1024" y="669" class="body">predict(X) on all fixed validation brains</text>
    <text x="1024" y="697" class="body">Mean Precision@K must improve</text>
    <text x="1024" y="725" class="body">Equal brain weights; regressions allowed</text>
    <text x="1024" y="755" class="note">No validation data or scores sent to the LLM</text>
  </g>
  <path d="M1392 648 H1462" class="flow"/>
  <text x="1430" y="634" font-size="14" text-anchor="middle" fill="#64748b">decision</text>

  <g id="select-and-record" data-box="1470 530 390 250">
    <rect x="1470" y="530" width="390" height="250" rx="20" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="1506" cy="568" r="21" fill="#0f172a"/>
    <text x="1506" y="575" class="step">7</text>
    <text x="1542" y="576" class="heading contract-title">Select + record</text>
    <text x="1494" y="613" font-size="17" font-weight="600" fill="#166534">Validation mean improves → replace parent</text>
    <text x="1494" y="641" font-size="17" font-weight="600" fill="#92400e">Reject / fail → retain parent</text>
    <text x="1494" y="669" class="body">TRAIN pool: up to 5 distinct Top-K sets</text>
    <text x="1494" y="697" class="body">2 stalled rounds → force exploration</text>
    <text x="1494" y="725" class="body">2 forced searches, no gain → pause</text>
    <text x="1494" y="755" class="note">All kinds paused → stop; keep accepted scorer</text>
  </g>

  <!-- In-session feedback uses TRAIN evidence only and never calls validation. -->
  <path d="M725 782 V817 H255 V782" class="feedback"/>
  <rect x="274" y="804" width="432" height="25" rx="6" fill="#eff6ff"/>
  <text x="490" y="822" font-size="16" text-anchor="middle" fill="#1e3a8a">TRAIN results → revise within the attempt budget</text>
  <text x="490" y="850" font-size="15" text-anchor="middle" fill="#475569">Formula path: evaluate_train / search_parameters · model path: train_classifier</text>
  <text x="490" y="874" font-size="15" text-anchor="middle" fill="#475569">fit sees TRAIN labels · predict sees no labels + read-only models · isolated CPU workers</text>

  <!-- Invalid submissions skip validation; an evaluation failure retains the parent. -->
  <path d="M1195 782 V817 H1665 V782" class="reject"/>
  <rect x="1214" y="804" width="432" height="25" rx="6" fill="#f0fdf4"/>
  <text x="1430" y="822" font-size="16" text-anchor="middle" fill="#92400e">Invalid / evaluation failure → keep parent</text>
  <text x="1430" y="859" font-size="15" text-anchor="middle" fill="#475569">Same fixed K and native pools · strict macro gain above the configured margin</text>

  <!-- Parent selection carries indirect validation feedback into later generations. -->
  <path d="M1750 782 V925 H36 V700 H58" class="feedback"/>
  <rect x="426" y="912" width="1008" height="27" rx="6" fill="#f8fafc"/>
  <text x="930" y="932" font-size="18" text-anchor="middle" fill="#1e3a8a">Explore: rewrite method · tune: refit numeric params · plateau: switch branch → stop</text>

  <g id="validation-boundary">
    <rect x="60" y="958" width="1800" height="66" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="960" y="985" font-size="20" font-weight="700" text-anchor="middle" fill="#92400e">Other eligible brains are development validation: hidden from the LLM; their mean selects the accepted scorer.</text>
    <text x="960" y="1011" font-size="17" text-anchor="middle" fill="#92400e">Selection provides indirect feedback across generations. An untouched final test requires a separate brain.</text>
  </g>

  <!-- Run artifacts are written throughout the run; final.json is written on completion. -->
  <g id="run-outputs" data-box="60 1050 1800 130">
    <rect x="60" y="1050" width="1800" height="130" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
    <text x="86" y="1092" class="heading">Run outputs</text>
    <text x="86" y="1122" class="note">runs/precision_…/</text>
    <line x1="308" y1="1070" x2="308" y2="1160" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="338" y="1092" class="code" font-weight="700">best_scorer.py</text>
    <text x="338" y="1122" class="code">+ model_artifacts/</text>
    <text x="338" y="1152" class="note">Keep both together to resume trained models</text>
    <line x1="659" y1="1070" x2="659" y2="1160" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="689" y="1092" class="code" font-weight="700">train_experiments.jsonl</text>
    <text x="689" y="1122" class="body">Training code, parameters, file hashes and outcomes</text>
    <text x="689" y="1152" class="note">Snapshots + training logs + pool / search summary</text>
    <line x1="1215" y1="1070" x2="1215" y2="1160" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1245" y="1092" class="code" font-weight="700">trajectory.txt / .jsonl · ledger.jsonl</text>
    <text x="1245" y="1122" class="body">Observable agent actions, tool results, decisions and cost</text>
    <text x="1245" y="1152" class="note">Validation reports remain outside the agent's file allowlist</text>
  </g>

  <rect x="60" y="1200" width="1800" height="32" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="960" y="1222" font-size="16" text-anchor="middle" fill="#475569">Scope: sparse native-label ranking. Graph repair efficacy requires separate evaluation; candidate pools, detector weights and K remain fixed.</text>
  <text x="60" y="1260" font-size="14" fill="#94a3b8">Defaults: detector fit + TRAIN 794495 · validation: other ready brains · mean-only gate · MCL 100 · K = 100 per kind · 5 generations</text>
  <text x="1860" y="1260" font-size="14" text-anchor="end" fill="#94a3b8">proofreader_evolve/workflow_diagram.svg</text>
</svg>
