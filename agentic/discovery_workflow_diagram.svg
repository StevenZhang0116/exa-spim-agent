<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L11,6 L0,12 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>

  <!-- Header -->
  <text x="80" y="82" font-size="42" font-weight="700" fill="#0f172a">Discovery workflow</text>
  <text x="80" y="122" font-size="22" fill="#64748b">Convert exploratory findings into reproduced, audited conclusions</text>

  <rect x="1440" y="68" width="28" height="20" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1480" y="85" font-size="17" fill="#334155">agent judgment</text>
  <rect x="1660" y="68" width="28" height="20" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1700" y="85" font-size="17" fill="#334155">driver compute</text>

  <!-- Cross-cutting execution contract -->
  <rect x="60" y="145" width="1800" height="34" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="690" y1="151" x2="690" y2="173" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="1260" y1="151" x2="1260" y2="173" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="82" y="167" font-size="14" fill="#334155">
    <tspan font-weight="700" fill="#0f172a">SESSION ISOLATION</tspan>
    <tspan> · fresh SDK session per agent step · file-based handoff</tspan>
  </text>
  <text x="712" y="167" font-size="14" fill="#334155">
    <tspan font-weight="700" fill="#0f172a">MODEL ROUTING</tspan>
    <tspan> · Opus 5.5 · analytical xhigh · mechanical medium</tspan>
  </text>
  <text x="1282" y="167" font-size="14" fill="#334155">
    <tspan font-weight="700" fill="#0f172a">OBSERVABILITY</tspan>
    <tspan> · per-step tokens · cache · model · time · cost</tspan>
  </text>

  <!-- Phase 1 -->
  <rect x="60" y="250" width="300" height="410" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="104" cy="298" r="24" fill="#0f172a"/>
  <text x="104" y="306" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
  <text x="144" y="306" font-size="26" font-weight="700" fill="#0f172a">Summarize</text>
  <rect x="88" y="356" width="244" height="94" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="393" font-size="19" font-weight="600" fill="#1e3a8a">Select hypotheses</text>
  <text x="110" y="423" font-size="16" fill="#475569">apply exclusion rules</text>
  <line x1="210" y1="450" x2="210" y2="486" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="88" y="494" width="244" height="112" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="532" font-size="19" font-weight="600" fill="#1e3a8a">Rank discoveries</text>
  <text x="110" y="562" font-size="16" fill="#475569">evidence × surprise</text>
  <text x="110" y="588" font-size="15" fill="#64748b">→ initial summary</text>

  <line x1="360" y1="455" x2="400" y2="455" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Phase 2 -->
  <rect x="410" y="190" width="410" height="530" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="454" cy="238" r="24" fill="#0f172a"/>
  <text x="454" y="246" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
  <text x="494" y="246" font-size="26" font-weight="700" fill="#0f172a">Reproduce</text>

  <rect x="438" y="298" width="354" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="462" y="334" font-size="19" font-weight="600" fill="#166534">Run recorded analysis as-is</text>
  <text x="462" y="364" font-size="16" fill="#475569">capture usable / unusable results</text>

  <line x1="615" y1="388" x2="615" y2="424" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="432" y="432" width="366" height="174" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="456" y="466" font-size="18" font-weight="700" fill="#334155">Loading repair loop · max 3 rounds</text>
  <rect x="456" y="492" width="142" height="82" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="527" y="526" font-size="17" font-weight="600" text-anchor="middle" fill="#1e3a8a">Fix loading</text>
  <text x="527" y="552" font-size="14" text-anchor="middle" fill="#475569">logic unchanged</text>
  <line x1="598" y1="533" x2="628" y2="533" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="636" y="492" width="138" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="705" y="526" font-size="17" font-weight="600" text-anchor="middle" fill="#166534">Remeasure</text>
  <text x="705" y="552" font-size="14" text-anchor="middle" fill="#475569">changed only</text>

  <line x1="615" y1="606" x2="615" y2="628" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="438" y="636" width="354" height="58" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="615" y="673" font-size="17" font-weight="600" text-anchor="middle" fill="#1e3a8a">REPRODUCED · DIVERGED · FAILED</text>

  <line x1="820" y1="455" x2="860" y2="455" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Phase 3 -->
  <rect x="870" y="250" width="300" height="410" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5" filter="url(#shadow)"/>
  <circle cx="914" cy="298" r="24" fill="#0f172a"/>
  <text x="914" y="306" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
  <text x="954" y="306" font-size="26" font-weight="700" fill="#0f172a">Generalize</text>
  <text x="898" y="350" font-size="16" fill="#64748b">optional held-out dataset</text>
  <rect x="898" y="386" width="244" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="920" y="423" font-size="19" font-weight="600" fill="#166534">Run on another brain</text>
  <text x="920" y="453" font-size="16" fill="#475569">without changing code</text>
  <line x1="1020" y1="476" x2="1020" y2="512" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="898" y="520" width="244" height="94" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="920" y="556" font-size="18" font-weight="600" fill="#1e3a8a">Judge transfer</text>
  <text x="920" y="586" font-size="15" fill="#475569">generalizes / partial / no</text>

  <line x1="1170" y1="455" x2="1210" y2="455" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Phase 4 -->
  <rect x="1220" y="250" width="280" height="410" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1264" cy="298" r="24" fill="#0f172a"/>
  <text x="1264" y="306" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
  <text x="1304" y="306" font-size="26" font-weight="700" fill="#0f172a">Audit</text>
  <rect x="1248" y="370" width="224" height="174" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1270" y="404" font-size="19" font-weight="600" fill="#1e3a8a">Check statistics</text>
  <text x="1270" y="436" font-size="17" fill="#475569">test choice</text>
  <text x="1270" y="464" font-size="17" fill="#475569">effect size</text>
  <text x="1270" y="492" font-size="17" fill="#475569">power and FDR</text>
  <text x="1270" y="528" font-size="16" font-weight="600" fill="#9a3412">deployability: GT-blind?</text>
  <text x="1248" y="596" font-size="16" fill="#64748b">Flag material problems +</text>
  <text x="1248" y="622" font-size="16" fill="#64748b">GT-referencing features</text>

  <line x1="1500" y1="455" x2="1540" y2="455" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Phase 5 -->
  <rect x="1550" y="220" width="310" height="470" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1594" cy="268" r="24" fill="#0f172a"/>
  <text x="1594" y="276" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
  <text x="1634" y="276" font-size="26" font-weight="700" fill="#0f172a">Correct</text>
  <rect x="1578" y="332" width="254" height="88" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1600" y="368" font-size="19" font-weight="600" fill="#1e3a8a">Write corrected test</text>
  <text x="1600" y="398" font-size="16" fill="#475569">for material issues only</text>
  <line x1="1705" y1="420" x2="1705" y2="452" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1578" y="460" width="254" height="88" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1600" y="496" font-size="19" font-weight="600" fill="#166534">Remeasure</text>
  <text x="1600" y="526" font-size="16" fill="#475569">run corrected analysis</text>
  <line x1="1705" y1="548" x2="1705" y2="580" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1578" y="588" width="254" height="66" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1705" y="629" font-size="14" font-weight="600" text-anchor="middle" fill="#1e3a8a">UPHELD · WEAKENED · OVERTURNED</text>

  <!-- Phase 6: split-only feature applicability -->
  <line x1="960" y1="720" x2="960" y2="746" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="420" y="754" width="1080" height="116" rx="20" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="8 5" filter="url(#shadow)"/>
  <circle cx="462" cy="790" r="22" fill="#0f172a"/>
  <text x="462" y="798" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
  <text x="500" y="798" font-size="23" font-weight="700" fill="#0f172a">Label feature applicability</text>
  <rect x="775" y="770" width="92" height="28" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="821" y="789" font-size="14" font-weight="700" text-anchor="middle" fill="#6d28d9">split only</text>

  <rect x="500" y="810" width="390" height="50" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="695" y="832" font-size="15" font-weight="600" text-anchor="middle" fill="#1e3a8a">Dedicated labeler: infer node-role requirement</text>
  <text x="695" y="851" font-size="12.5" text-anchor="middle" fill="#475569">both tips · tip anchor · no tip · unclear</text>
  <line x1="890" y1="834" x2="948" y2="834" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="956" y="810" width="430" height="50" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1171" y="841" font-size="16" font-weight="600" text-anchor="middle" fill="#166534">Driver: bind exact source path + SHA-256</text>

  <!-- Final outputs -->
  <line x1="960" y1="870" x2="960" y2="894" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="250" y="902" width="1420" height="104" rx="22" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="292" y="939" font-size="18" font-weight="700" fill="#3730a3">DISCOVERY OUTPUTS</text>
  <line x1="920" y1="920" x2="920" y2="988" stroke="#c7d2fe" stroke-width="2"/>
  <text x="578" y="969" font-size="23" font-weight="700" text-anchor="middle" fill="#3730a3">Final discovery report</text>
  <text x="578" y="992" font-size="15" text-anchor="middle" fill="#475569">ranked findings · reproduction · transfer · audit + deployability verdicts</text>
  <text x="1290" y="965" font-size="19" font-weight="700" text-anchor="middle" fill="#3730a3">split-feature-applicability.json</text>
  <text x="1290" y="990" font-size="15" text-anchor="middle" fill="#475569">split only · source-bound feature requirements</text>

  <text x="80" y="1040" font-size="15" fill="#94a3b8">agentic/run_discovery_workflow.py</text>
</svg>
