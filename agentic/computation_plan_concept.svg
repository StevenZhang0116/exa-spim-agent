<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L11,6 L0,12 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>

  <!-- Header -->
  <text x="80" y="72" font-size="40" font-weight="700" fill="#0f172a">COMPUTATION_PLAN — the cost-discipline contract</text>
  <text x="80" y="110" font-size="21" fill="#64748b">Plan cost before writing feature code; the assembler mechanically rejects plans the implementation does not honor</text>

  <rect x="1360" y="58" width="28" height="20" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1400" y="75" font-size="16" fill="#334155">agent declares</text>
  <rect x="1560" y="58" width="28" height="20" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1600" y="75" font-size="16" fill="#334155">driver enforces</text>
  <rect x="1360" y="88" width="28" height="20" rx="5" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1400" y="105" font-size="16" fill="#334155">literal artifact</text>

  <!-- Row 1: plan -> declare -> gate -->
  <rect x="70" y="140" width="500" height="230" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="108" cy="180" r="20" fill="#0f172a"/>
  <text x="108" y="187" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
  <text x="142" y="187" font-size="21" font-weight="700" fill="#0f172a">Enumerate primitives first</text>
  <rect x="96" y="206" width="448" height="140" rx="11" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="234" font-size="15.5" font-weight="600" fill="#1e3a8a">Before any feature code, list the computational</text>
  <text x="120" y="256" font-size="15.5" font-weight="600" fill="#1e3a8a">primitives the features need, e.g.</text>
  <text x="132" y="282" font-size="14" font-family="monospace" fill="#334155">global_node_kdtree · endpoint_tangent_walk</text>
  <text x="132" y="303" font-size="14" font-family="monospace" fill="#334155">component_segment_index · node_property_arrays</text>
  <text x="120" y="330" font-size="14.5" fill="#475569">and find where hypotheses can share one result</text>

  <line x1="570" y1="255" x2="620" y2="255" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="630" y="140" width="620" height="230" rx="18" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="668" cy="180" r="20" fill="#0f172a"/>
  <text x="668" y="187" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
  <text x="702" y="187" font-size="21" font-weight="700" fill="#0f172a">Declare a literal plan</text>
  <text x="1030" y="187" font-size="15" font-family="monospace" font-weight="700" fill="#5b21b6">COMPUTATION_PLAN = [ ... ]</text>
  <rect x="656" y="206" width="568" height="140" rx="11" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="680" y="234" font-size="15" fill="#334155">One object per primitive, with exactly five keys:</text>
  <text x="692" y="261" font-size="14.5" font-family="monospace" fill="#5b21b6">primitive</text>
  <text x="810" y="261" font-size="14" fill="#475569">unique short name</text>
  <text x="692" y="284" font-size="14.5" font-family="monospace" fill="#5b21b6">cost_class</text>
  <text x="810" y="284" font-size="14" fill="#475569">closed vocabulary (ladder below)</text>
  <text x="692" y="307" font-size="14.5" font-family="monospace" fill="#5b21b6">bound · amortization</text>
  <text x="920" y="307" font-size="14" fill="#475569">honest, checked for substance</text>
  <text x="692" y="330" font-size="14.5" font-family="monospace" fill="#5b21b6">consumers</text>
  <text x="810" y="330" font-size="14" fill="#475569">timing-group keys; every group covered ≥ once</text>

  <line x1="1250" y1="255" x2="1300" y2="255" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1310" y="140" width="540" height="230" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1348" cy="180" r="20" fill="#0f172a"/>
  <text x="1348" y="187" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
  <text x="1382" y="187" font-size="21" font-weight="700" fill="#0f172a">Deterministic assembler gate</text>
  <rect x="1336" y="206" width="488" height="140" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1360" y="232" font-size="15" font-weight="600" fill="#166534">Mechanically rejects:</text>
  <text x="1372" y="256" font-size="14" fill="#334155">· missing / non-literal plan · unknown cost class</text>
  <text x="1372" y="278" font-size="14" fill="#334155">· missing bound or amortization for expensive classes</text>
  <text x="1372" y="300" font-size="14" fill="#334155">· consumers naming unknown timing groups, or groups</text>
  <text x="1384" y="320" font-size="14" fill="#334155">no primitive covers</text>
  <text x="1372" y="342" font-size="14" fill="#334155">· declared memoization with no _memoized call in code</text>

  <!-- Row 2: cost-class ladder -->
  <text x="80" y="428" font-size="24" font-weight="700" fill="#0f172a">Cost-class ladder</text>
  <text x="330" y="428" font-size="16" fill="#64748b">closed vocabulary; each class carries obligations — when unsure, declare the more expensive class (constraints only tighten)</text>

  <rect x="70" y="448" width="320" height="170" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="448" width="320" height="44" rx="14" fill="#e2e8f0"/>
  <text x="230" y="477" font-size="17" font-family="monospace" font-weight="700" text-anchor="middle" fill="#334155">constant</text>
  <text x="94" y="520" font-size="14" fill="#475569">O(1) arithmetic or reads of</text>
  <text x="94" y="542" font-size="14" fill="#475569">precomputed row/sample fields</text>
  <text x="94" y="580" font-size="13.5" font-weight="600" fill="#16a34a">obligation: none</text>

  <rect x="428" y="448" width="320" height="170" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <rect x="428" y="448" width="320" height="44" rx="14" fill="#dbeafe"/>
  <text x="588" y="477" font-size="17" font-family="monospace" font-weight="700" text-anchor="middle" fill="#1e3a8a">bounded_local</text>
  <text x="452" y="520" font-size="14" fill="#475569">fixed-k lookups, walks with a</text>
  <text x="452" y="542" font-size="14" fill="#475569">hard step limit</text>
  <text x="452" y="580" font-size="13.5" font-weight="600" fill="#1d4ed8">obligation: explicit step limit</text>

  <rect x="786" y="448" width="320" height="170" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="786" y="448" width="320" height="44" rx="14" fill="#fef3c7"/>
  <text x="946" y="477" font-size="17" font-family="monospace" font-weight="700" text-anchor="middle" fill="#92400e">density_scaled</text>
  <text x="810" y="520" font-size="14" fill="#475569">work grows with local point /</text>
  <text x="810" y="542" font-size="14" fill="#475569">node density (radius queries…)</text>
  <text x="810" y="572" font-size="13.5" font-weight="600" fill="#b45309">obligation: concrete bound +</text>
  <text x="810" y="592" font-size="13.5" font-weight="600" fill="#b45309">memoization key (amortization)</text>

  <rect x="1144" y="448" width="320" height="170" rx="14" fill="#ffffff" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1144" y="448" width="320" height="44" rx="14" fill="#ffedd5"/>
  <text x="1304" y="477" font-size="17" font-family="monospace" font-weight="700" text-anchor="middle" fill="#9a3412">component_scaled</text>
  <text x="1168" y="520" font-size="14" fill="#475569">work grows with connected-</text>
  <text x="1168" y="542" font-size="14" fill="#475569">component size</text>
  <text x="1168" y="572" font-size="13.5" font-weight="600" fill="#c2410c">obligation: cutoff / node cap, or</text>
  <text x="1168" y="592" font-size="13.5" font-weight="600" fill="#c2410c">per-component memoization</text>

  <rect x="1502" y="448" width="348" height="170" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1502" y="448" width="348" height="44" rx="14" fill="#fee2e2"/>
  <text x="1676" y="477" font-size="17" font-family="monospace" font-weight="700" text-anchor="middle" fill="#991b1b">global_scan</text>
  <text x="1526" y="518" font-size="14" fill="#475569">touches full node/candidate arrays:</text>
  <text x="1526" y="540" font-size="14" fill="#475569">filtering, sorting, clustering, reductions</text>
  <text x="1526" y="572" font-size="13.5" font-weight="600" fill="#b91c1c">obligation: one-time pre-pass;</text>
  <text x="1526" y="592" font-size="13.5" font-weight="600" fill="#b91c1c">FORBIDDEN on the per-row path</text>

  <line x1="390" y1="533" x2="426" y2="533" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="748" y1="533" x2="784" y2="533" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1106" y1="533" x2="1142" y2="533" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1464" y1="533" x2="1500" y2="533" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Row 3: binding invariants -->
  <text x="80" y="678" font-size="24" font-weight="700" fill="#0f172a">Three invariants bind the implementation, not just the plan</text>

  <rect x="70" y="698" width="576" height="168" rx="16" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="98" y="734" font-size="19" font-weight="700" fill="#1e3a8a">Compute-once</text>
  <text x="98" y="762" font-size="14.5" fill="#475569">Identical (primitive, parameters) result shared by several</text>
  <text x="98" y="784" font-size="14.5" fill="#475569">hypotheses is computed once through the shared helper:</text>
  <rect x="98" y="800" width="420" height="34" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="112" y="823" font-size="14.5" font-family="monospace" fill="#1d4ed8">_memoized(cache, key, compute)</text>
  <text x="98" y="856" font-size="13" fill="#64748b">one dict per primitive · keyed by the declared amortization key</text>

  <rect x="672" y="698" width="576" height="168" rx="16" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="734" font-size="19" font-weight="700" fill="#1e3a8a">Boundedness</text>
  <text x="700" y="762" font-size="14.5" fill="#475569">Every graph traversal or shortest-path call carries an</text>
  <text x="700" y="784" font-size="14.5" fill="#475569">explicit cutoff or node cap matching the declared bound.</text>
  <text x="700" y="820" font-size="14" fill="#334155">If a cutoff would truncate whole-component semantics:</text>
  <text x="700" y="844" font-size="14" font-weight="600" fill="#c2410c">keep semantics → component_scaled + memoization,</text>
  <text x="700" y="864" font-size="14" font-weight="600" fill="#c2410c">never silent truncation</text>

  <rect x="1274" y="698" width="576" height="168" rx="16" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1302" y="734" font-size="19" font-weight="700" fill="#1e3a8a">Pre-pass</text>
  <text x="1302" y="762" font-size="14.5" fill="#475569">Full-array / whole-candidate work runs once before the</text>
  <text x="1302" y="784" font-size="14.5" fill="#475569">row loop; rows do dict/array lookups only.</text>
  <text x="1302" y="820" font-size="14" fill="#334155">Materialize the DERIVED result (scalar, aggregate, index):</text>
  <text x="1302" y="844" font-size="14" font-family="monospace" fill="#991b1b">per-row np.min(xyz[:, 2])</text>
  <text x="1560" y="844" font-size="14" fill="#334155">is still a global scan</text>

  <!-- Row 4: closing the loop -->
  <rect x="70" y="900" width="1780" height="140" rx="20" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="98" y="936" font-size="19" font-weight="700" fill="#5b21b6">CLOSING THE LOOP · plan ↔ code ↔ measured reality</text>

  <rect x="98" y="954" width="540" height="66" rx="11" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="368" y="981" font-size="15.5" font-weight="600" text-anchor="middle" fill="#5b21b6">consumers ↔ ANALYSIS_TIMING_GROUPS</text>
  <text x="368" y="1004" font-size="13.5" text-anchor="middle" fill="#475569">every timing group covered · each group is a removable selection unit</text>

  <line x1="638" y1="987" x2="686" y2="987" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="694" y="954" width="560" height="66" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="974" y="981" font-size="15.5" font-weight="600" text-anchor="middle" fill="#166534">--measuretime cross-check</text>
  <text x="974" y="1004" font-size="13.5" text-anchor="middle" fill="#475569">groups declared all-cheap but measured slow are flagged as plan defects</text>

  <line x1="1254" y1="987" x2="1302" y2="987" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="1310" y="954" width="512" height="66" rx="11" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1566" y="981" font-size="15.5" font-weight="600" text-anchor="middle" fill="#1e3a8a">Semantics preserved</text>
  <text x="1566" y="1004" font-size="13.5" text-anchor="middle" fill="#475569">optimizations reorganize computation only — feature values never change</text>
</svg>
