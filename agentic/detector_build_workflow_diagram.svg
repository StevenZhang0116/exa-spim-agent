<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Helvetica Neue',Arial,sans-serif">
  <title>Detector-build workflow with reviewed split and merge-site feature contracts</title>
  <desc>Agents propose feature semantics and implementations. The driver validates source provenance, inventory schemas, feature scopes and computation costs, then assembles a reviewed runtime. Merge-site inventory v4 distinguishes candidate-local values from segment context; only segment context is broadcast. Split inventory v5 declares source formulas, anchors and occurrence reductions; runtime handles tip orientation and stores one value per candidate pair. Adaptations require distinct names and subsequent model training. Declared contracts and synthetic smoke tests do not prove arbitrary generated formulas correct.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L11,6 L0,12 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>

  <!-- Header -->
  <text x="80" y="82" font-size="42" font-weight="700" fill="#0f172a">Detector-build workflow</text>
  <text x="80" y="122" font-size="22" fill="#64748b">Turn validated discoveries into detector code; training runs separately</text>

  <rect x="1450" y="68" width="28" height="20" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1490" y="85" font-size="17" fill="#334155">agent proposes</text>
  <rect x="1660" y="68" width="28" height="20" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1700" y="85" font-size="17" fill="#334155">driver validates</text>

  <!-- Candidate-policy stage 0 -->
  <rect x="70" y="150" width="1780" height="112" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="8 5"/>
  <circle cx="112" cy="198" r="22" fill="#0f172a"/>
  <text x="112" y="206" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">0</text>
  <text x="150" y="193" font-size="22" font-weight="700" fill="#0f172a">Freeze policy</text>
  <text x="150" y="218" font-size="14" fill="#6d28d9">split · merge-site</text>
  <rect x="410" y="173" width="310" height="50" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="565" y="193" font-size="15" font-weight="600" text-anchor="middle" fill="#1e3a8a">split: agent interprets AI review</text>
  <text x="565" y="213" font-size="13" text-anchor="middle" fill="#475569">merge-site: no agent turn</text>
  <line x1="720" y1="198" x2="778" y2="198" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="786" y="173" width="410" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="991" y="192" font-size="15" font-weight="600" text-anchor="middle" fill="#166534">Re-derive argmin from sweep evidence</text>
  <text x="991" y="214" font-size="12.5" text-anchor="middle" fill="#475569">worst-brain recall ≥ 0.90 (split) · site recall ≥ 0.80 (merge)</text>
  <line x1="1196" y1="198" x2="1254" y2="198" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1262" y="173" width="522" height="50" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1523" y="192" font-size="15" font-family="monospace" font-weight="700" text-anchor="middle" fill="#5b21b6">split_candidate_policy.json</text>
  <text x="1523" y="214" font-size="15" font-family="monospace" font-weight="700" text-anchor="middle" fill="#5b21b6">merge_candidate_policy.json</text>
  <text x="960" y="246" font-size="14" text-anchor="middle" fill="#92400e">Merge preflight: manifest-bound per-brain metadata + live cache identity (path / size / mtime / inode); reject stale evidence before output cleanup.</text>
  <path d="M1523 223 V228 H1804 V268 H1254 V271" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- Main pipeline -->
  <rect x="70" y="286" width="270" height="286" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="96" y="328" font-size="23" font-weight="700" fill="#334155">Inputs</text>
  <text x="96" y="373" font-size="17" fill="#475569">Discovery summary</text>
  <text x="96" y="405" font-size="17" fill="#475569">Hypothesis scripts</text>
  <text x="96" y="437" font-size="17" fill="#475569">Model policy</text>
  <text x="96" y="469" font-size="15" font-weight="600" fill="#6d28d9">Split applicability JSON</text>
  <text x="96" y="520" font-size="15" fill="#64748b">Reviewed evidence + exact</text>
  <text x="96" y="544" font-size="15" fill="#64748b">source-bound semantics</text>

  <line x1="340" y1="429" x2="378" y2="429" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="388" y="274" width="310" height="310" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="428" cy="318" r="22" fill="#0f172a"/>
  <text x="428" y="326" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
  <text x="466" y="326" font-size="22" font-weight="700" fill="#0f172a">Feature inventory</text>
  <rect x="416" y="358" width="254" height="76" rx="11" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="543" y="382" font-size="14.5" font-weight="600" text-anchor="middle" fill="#1e3a8a">Source + scope + adaptation</text>
  <text x="543" y="404" font-size="12" text-anchor="middle" fill="#475569">Merge scope · split anchor / reduction</text>
  <text x="543" y="423" font-size="12.5" text-anchor="middle" fill="#475569">local adaptation → distinct name</text>
  <line x1="543" y1="434" x2="543" y2="458" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="416" y="466" width="254" height="88" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="543" y="487" font-size="16" font-weight="600" text-anchor="middle" fill="#166534">Join ID + source SHA</text>
  <text x="543" y="507" font-size="12.5" text-anchor="middle" fill="#475569">v2 legacy · v4 merge-site · v5 split</text>
  <text x="543" y="525" font-size="12.5" text-anchor="middle" fill="#475569">Scope + GT-deployability gates</text>
  <text x="543" y="545" font-size="14" font-family="monospace" text-anchor="middle" fill="#334155">feature_inventory.json</text>

  <line x1="698" y1="429" x2="736" y2="429" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="746" y="274" width="300" height="310" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="786" cy="318" r="22" fill="#0f172a"/>
  <text x="786" y="326" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
  <text x="824" y="326" font-size="23" font-weight="700" fill="#0f172a">Model setup</text>
  <rect x="774" y="358" width="244" height="76" rx="11" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="896" y="389" font-size="17" font-weight="600" text-anchor="middle" fill="#1e3a8a">Choose families + grids</text>
  <text x="896" y="414" font-size="14" text-anchor="middle" fill="#475569">feature-based rationale only</text>
  <line x1="896" y1="434" x2="896" y2="458" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="774" y="466" width="244" height="88" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="896" y="497" font-size="17" font-weight="600" text-anchor="middle" fill="#166534">Enforce model policy</text>
  <text x="896" y="532" font-size="14" font-family="monospace" text-anchor="middle" fill="#334155">model_candidates.json</text>

  <line x1="1046" y1="429" x2="1084" y2="429" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1094" y="274" width="320" height="310" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1134" cy="318" r="22" fill="#0f172a"/>
  <text x="1134" y="326" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
  <text x="1172" y="326" font-size="23" font-weight="700" fill="#0f172a">Build detector</text>
  <rect x="1122" y="358" width="264" height="76" rx="11" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1254" y="384" font-size="17" font-weight="600" text-anchor="middle" fill="#1e3a8a">Plan costs + implement</text>
  <text x="1254" y="404" font-size="12" text-anchor="middle" fill="#475569">Shared pre-pass + enabled analyses</text>
  <text x="1254" y="422" font-size="12" text-anchor="middle" fill="#475569">COMPUTATION_PLAN · GT-blind features</text>
  <line x1="1254" y1="434" x2="1254" y2="458" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1122" y="466" width="264" height="88" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1254" y="487" font-size="14.5" font-weight="600" text-anchor="middle" fill="#166534">Validate + assemble runtime</text>
  <text x="1254" y="507" font-size="12" text-anchor="middle" fill="#475569">Registry / scope · cost / GT-access lint</text>
  <text x="1254" y="525" font-size="12" text-anchor="middle" fill="#475569">Split / merge-site: reviewed accumulator</text>
  <text x="1254" y="545" font-size="14" font-family="monospace" text-anchor="middle" fill="#334155">*_detector.py</text>

  <line x1="1414" y1="429" x2="1452" y2="429" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1462" y="274" width="388" height="310" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1502" cy="318" r="22" fill="#0f172a"/>
  <text x="1502" y="326" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
  <text x="1540" y="326" font-size="23" font-weight="700" fill="#0f172a">Verify + package</text>
  <rect x="1490" y="358" width="332" height="76" rx="11" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1656" y="381" font-size="15" font-weight="600" text-anchor="middle" fill="#1e3a8a">Review formulas + local adaptations</text>
  <text x="1656" y="400" font-size="12.5" text-anchor="middle" fill="#475569">Request reference checks; report untested math</text>
  <text x="1656" y="416" font-size="12.5" text-anchor="middle" fill="#475569">Both GT sources; zero is not verified negative</text>
  <text x="1656" y="430" font-size="12" text-anchor="middle" fill="#475569">Cost, blindness + label-provenance contracts</text>
  <line x1="1656" y1="434" x2="1656" y2="458" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1490" y="466" width="332" height="88" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1656" y="492" font-size="15.5" font-weight="600" text-anchor="middle" fill="#166534">Artifact checks + synthetic smoke</text>
  <text x="1656" y="515" font-size="12.5" text-anchor="middle" fill="#475569">Build + draft recovery use the same validators</text>
  <text x="1656" y="539" font-size="14" text-anchor="middle" fill="#334155">README + reproducible runbook</text>

  <!-- Independent candidate-universe and feature-scope contracts -->
  <line x1="960" y1="584" x2="960" y2="610" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <rect x="160" y="618" width="1600" height="142" rx="22" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="198" y="654" font-size="20" font-weight="700" fill="#5b21b6">SPLIT &amp; MERGE-SITE · TWO INDEPENDENT CONTRACTS</text>
  <rect x="260" y="666" width="670" height="68" rx="13" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="595" y="689" font-size="18" font-weight="700" text-anchor="middle" fill="#5b21b6">Candidate policy → row universe</text>
  <text x="595" y="708" font-size="13" text-anchor="middle" fill="#475569">split: pairing mode · radius · k — GT-blind enumeration</text>
  <text x="595" y="726" font-size="13" text-anchor="middle" fill="#475569">merge-site: junctions · segment NMS · claim + label radii</text>
  <text x="960" y="711" font-size="28" font-weight="700" text-anchor="middle" fill="#94a3b8">≠</text>
  <rect x="990" y="666" width="670" height="68" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1325" y="689" font-size="18" font-weight="700" text-anchor="middle" fill="#166534">Feature scope → value storage + definedness</text>
  <text x="1325" y="708" font-size="13" text-anchor="middle" fill="#475569">split v5: runtime anchor + compatible-occurrence reduction → candidate pair</text>
  <text x="1325" y="726" font-size="13" text-anchor="middle" fill="#475569">merge-site v4: runtime set_candidate / set_segment; only context broadcasts</text>
  <text x="960" y="751" font-size="13" text-anchor="middle" fill="#92400e">Merge-site: reject all-context inventories and wrong-scope writes. Declared scope does not prove formula correctness.</text>

  <!-- Allowlisted models -->
  <line x1="960" y1="760" x2="960" y2="782" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="160" y="790" width="1600" height="116" rx="22" fill="#ffffff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="198" y="826" font-size="21" font-weight="700" fill="#3730a3">Allowed model families</text>
  <text x="198" y="854" font-size="14" fill="#64748b">fixed before training</text>
  <rect x="500" y="810" width="470" height="76" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="735" y="840" font-size="17" font-weight="700" text-anchor="middle" fill="#166534">Required baselines · always included</text>
  <text x="735" y="866" font-size="14" text-anchor="middle" fill="#334155">L2 · histogram gradient boosting · XGBoost</text>
  <rect x="1010" y="810" width="710" height="76" rx="13" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1365" y="840" font-size="17" font-weight="700" text-anchor="middle" fill="#1e3a8a">Optional extensions · choose 0–2 with feature rationale</text>
  <text x="1365" y="866" font-size="14" text-anchor="middle" fill="#334155">Elastic-net · Spline · EBM · Extra Trees · Random Forest</text>

  <line x1="960" y1="906" x2="960" y2="918" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Deliverables -->
  <rect x="250" y="923" width="1420" height="58" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="292" y="947" font-size="19" font-weight="700" fill="#3730a3">Build deliverables (no trained model yet)</text>
  <text x="292" y="969" font-size="15" fill="#374151">Frozen candidate policy · feature inventory · model configuration · self-contained detector code · README + instance-bound runbook</text>

  <line x1="960" y1="982" x2="960" y2="996" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="250" y="1002" width="1420" height="64" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="292" y="1025" font-size="17" font-weight="700" fill="#166534">Later: train / evaluate / profile on a compute node; retrain after local feature adaptations</text>
  <text x="292" y="1043" font-size="13.5" fill="#374151">Train/test cache identities + site-content and row-label hashes; reject cache replacement during load/extraction.</text>
  <text x="292" y="1059" font-size="13.5" fill="#374151">Training outputs: model JSON + joblib + &lt;output.csv&gt;.provenance.json share data_provenance; profiling records its sampled rows.</text>
</svg>
