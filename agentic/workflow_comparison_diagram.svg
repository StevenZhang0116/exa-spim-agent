<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="title description">
  <title id="title">Two workflows, one proofreading goal</title>
  <desc id="description">Comparison of exa-spim-agent and agentic_proofreading, whose package is exaproof. The first validates discoveries, generates detector code, fits detectors offline, and evolves cut and join policies using held-out fitness. The second mines supervision from fragment skeletons and gold tracings, fits decision models, reconstructs from a soma seed, and defers uncertain decisions to human review. Optional paths include ROI cable generation and LLM-proposed feature learning. The projects are separate implementations with different labels, candidate units, and evaluation metrics.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .heading { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 17px; fill: #475569; }
      .note { font-size: 15px; fill: #64748b; }
      .agent-title { fill: #1e3a8a; }
      .compute-title { fill: #166534; }
      .human-title { fill: #92400e; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <text x="60" y="78" font-size="42" font-weight="700" fill="#0f172a">Two workflows, one proofreading goal</text>
  <text x="60" y="116" font-size="22" fill="#64748b">exa-spim-agent vs. agentic_proofreading (exaproof)</text>

  <g id="legend">
    <rect x="1270" y="57" width="25" height="19" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="1307" y="73" font-size="17" fill="#334155">LLM / agent judgment</text>
    <rect x="1595" y="57" width="25" height="19" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="1632" y="73" font-size="17" fill="#334155">Model / compute</text>
    <rect x="1270" y="95" width="25" height="19" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="1307" y="111" font-size="17" fill="#334155">Human review</text>
    <path d="M1595 104 H1624" class="feedback"/>
    <text x="1640" y="111" font-size="17" fill="#334155">Feedback / optional</text>
  </g>

  <rect x="60" y="143" width="1800" height="38" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="82" y="168" font-size="17" fill="#334155">
    <tspan font-weight="700" fill="#0f172a">SHARED TASK</tspan>
    <tspan dx="14">Repair splits and merges in neuron reconstructions while avoiding false joins.</tspan>
  </text>
  <text x="1838" y="168" text-anchor="end" font-size="16" fill="#64748b">Different orchestration, data contracts and success criteria</text>

  <circle cx="84" cy="221" r="23" fill="#0f172a"/>
  <text x="84" y="229" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">A</text>
  <text x="122" y="230" font-size="28" font-weight="700" fill="#0f172a">exa-spim-agent</text>
  <text x="470" y="228" font-size="19" fill="#475569">Validated error patterns become detectors and evolving repair policies</text>

  <g id="exa-inputs" data-box="60 258 270 182">
    <rect x="60" y="258" width="270" height="182" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="296" class="heading">Inputs &amp; labels</text>
    <text x="80" y="328" class="body">GT + fragment skeletons</text>
    <text x="80" y="354" class="body">Dense segmentation labels</text>
    <text x="80" y="380" class="body">AutoDiscovery run exports</text>
    <text x="80" y="422" class="note">Labeled caches + hypotheses</text>
  </g>
  <path d="M334 349 H360" class="flow"/>

  <g id="exa-discovery" data-box="370 258 300 182">
    <rect x="370" y="258" width="300" height="182" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <text x="390" y="296" class="heading agent-title">Validate discoveries</text>
    <text x="390" y="328" class="body">Reproduce; test transfer*</text>
    <text x="390" y="354" class="body">Audit statistics and GT use</text>
    <text x="390" y="380" class="body">Correct and remeasure</text>
    <text x="390" y="422" class="note">Report + eligible features</text>
  </g>
  <path d="M674 349 H700" class="flow"/>

  <g id="exa-detectors" data-box="710 258 350 182">
    <rect x="710" y="258" width="350" height="182" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <path d="M711 350 H1059 V428 Q1059 439 1048 439 H722 Q711 439 711 428 Z" fill="#dcfce7"/>
    <line x1="711" y1="350" x2="1059" y2="350" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="730" y="292" class="heading agent-title">Generate detector code</text>
    <text x="730" y="319" font-size="16" fill="#475569">Frozen policy + source-bound features</text>
    <text x="730" y="339" class="note">Cache identity checked; no payload load</text>
    <text x="730" y="379" font-size="20" font-weight="700" fill="#166534">Fit + score offline</text>
    <text x="730" y="403" class="body">Nested CV; winner OOF for review</text>
    <text x="730" y="425" font-size="14" fill="#64748b">Save model + data / label provenance</text>
  </g>
  <path d="M1064 349 H1090" class="flow"/>

  <g id="exa-evolution" data-box="1100 258 350 182">
    <rect x="1100" y="258" width="350" height="182" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <path d="M1101 368 H1449 V428 Q1449 439 1438 439 H1112 Q1101 439 1101 428 Z" fill="#dcfce7"/>
    <line x1="1101" y1="368" x2="1449" y2="368" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1120" y="296" class="heading agent-title">Evolve repair policy</text>
    <text x="1120" y="328" class="body">Detector priors + proposed edits</text>
    <text x="1120" y="354" font-size="16" fill="#475569">Cut merges, then join split fragments</text>
    <text x="1120" y="396" font-size="19" font-weight="700" fill="#166534">Held-out fitness gate</text>
    <text x="1120" y="424" font-size="16" fill="#475569">Keep improvements; reject regressions</text>
  </g>
  <path d="M1454 349 H1480" class="flow"/>
  <path d="M1408 443 V470 H1142 V443" class="feedback"/>
  <text x="1275" y="495" text-anchor="middle" class="note">Revise policy, then remeasure</text>

  <g id="exa-outputs" data-box="1490 258 370 182">
    <rect x="1490" y="258" width="370" height="182" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
    <text x="1510" y="296" class="heading">Detectors + edit policies</text>
    <text x="1510" y="328" class="body">Ranked candidate scores</text>
    <text x="1510" y="354" class="body">Accepted cut / join policies</text>
    <text x="1510" y="380" class="body">Edit ledger + evaluation</text>
    <text x="1510" y="406" font-size="14" fill="#64748b">CSV sidecar: cache identity + label hashes</text>
    <text x="1510" y="429" class="note">Unit: sites, labels and segment pairs</text>
  </g>
  <text x="60" y="479" class="note">* Cross-brain reproduction is optional in discovery.</text>
  <text x="60" y="512" font-size="18" fill="#475569">Selection targets: evidence quality, detection performance and held-out repair fitness.</text>

  <line x1="60" y1="536" x2="1860" y2="536" stroke="#cbd5e1" stroke-width="1.5"/>

  <circle cx="84" cy="579" r="23" fill="#0f172a"/>
  <text x="84" y="587" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">B</text>
  <text x="122" y="588" font-size="28" font-weight="700" fill="#0f172a">agentic_proofreading</text>
  <text x="470" y="586" font-size="19" fill="#475569">exaproof: seed-based reconstruction with adaptive evidence and human review</text>

  <g id="exaproof-inputs" data-box="60 616 270 182">
    <rect x="60" y="616" width="270" height="182" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="654" font-size="21" font-weight="700" fill="#0f172a">Data &amp; labels</text>
    <text x="80" y="686" class="body">SWCs + GT + imagery</text>
    <text x="80" y="712" class="body">GT-to-fragment alignment</text>
    <text x="80" y="738" class="body">Mine real join decisions</text>
    <text x="80" y="780" class="note">Seed: soma or fragment</text>
  </g>
  <path d="M334 707 H360" class="flow"/>

  <g id="exaproof-models" data-box="370 616 300 182">
    <rect x="370" y="616" width="300" height="182" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <text x="390" y="654" class="heading compute-title">Fit decision models</text>
    <text x="390" y="686" class="body">Geometry + image evidence</text>
    <text x="390" y="712" class="body">Calibrated join / choice models</text>
    <text x="390" y="738" class="body">Choose a continuation or none</text>
    <text x="390" y="780" class="note">GT used for training / evaluation</text>
  </g>
  <path d="M674 707 H700" class="flow"/>

  <g id="exaproof-reconstruction" data-box="710 616 350 182">
    <rect x="710" y="616" width="350" height="182" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <text x="730" y="654" class="heading compute-title">Reconstruct one neuron</text>
    <text x="730" y="686" class="body">Merge-first; regenerate candidates</text>
    <text x="730" y="712" class="body">Score; resolve conflicts; join</text>
    <text x="730" y="738" class="body">Read image evidence as needed</text>
    <text x="730" y="780" class="note">Optional ROI-grown missing cable</text>
  </g>
  <path d="M1064 707 H1090" class="flow"/>
  <text x="1080" y="696" text-anchor="middle" font-size="12" fill="#92400e">defer</text>

  <g id="exaproof-review" data-box="1100 616 350 182">
    <rect x="1100" y="616" width="350" height="182" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
    <text x="1120" y="654" class="heading human-title">Human review</text>
    <text x="1120" y="686" class="body">Inspect images + alternatives</text>
    <text x="1120" y="712" class="body">Accept / reject / cut / skip</text>
    <text x="1120" y="738" class="body">Record decisions and time</text>
    <text x="1120" y="780" class="note">Viewer; simulated-human evaluation</text>
  </g>
  <path d="M1454 707 H1480" class="flow"/>
  <path d="M1275 801 V826 H885 V801" class="feedback"/>
  <text x="1080" y="851" text-anchor="middle" class="note">Session loop: update state and re-plan</text>

  <g id="exaproof-outputs" data-box="1490 616 370 182">
    <rect x="1490" y="616" width="370" height="182" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
    <text x="1510" y="654" class="heading">Reconstruction + worklist</text>
    <text x="1510" y="686" class="body">SWC + reversible edit journal</text>
    <text x="1510" y="712" class="body">Unresolved sites + evidence</text>
    <text x="1510" y="738" class="body">Decision traces + timing logs</text>
    <text x="1510" y="780" class="note">Unit: a seeded neuron + its frontier</text>
  </g>
  <path d="M1690 801 V876 H520 V801" class="feedback"/>
  <rect x="555" y="862" width="1065" height="28" rx="6" fill="#f8fafc"/>
  <text x="1087" y="882" text-anchor="middle" font-size="16" fill="#1e3a8a">Optional offline learning: failures -&gt; LLM-proposed features -&gt; measured promotion</text>

  <rect x="60" y="925" width="1800" height="105" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="660" y1="941" x2="660" y2="1014" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="1260" y1="941" x2="1260" y2="1014" stroke="#cbd5e1" stroke-width="1.5"/>
  <g id="shared-safety" data-box="60 925 600 105">
    <text x="82" y="954" font-size="15" font-weight="700" fill="#0f172a">SHARED SAFETY</text>
    <text x="82" y="981" class="body">Avoid false joins; keep GT out of runtime features.</text>
    <text x="82" y="1008" class="body">Check held-out neurons / brains.</text>
  </g>
  <g id="metrics" data-box="660 925 600 105">
    <text x="682" y="954" font-size="15" font-weight="700" fill="#0f172a">DIFFERENT MEASUREMENTS</text>
    <text x="682" y="981" class="body">Detector metrics + edit fitness vs. session cov@60.</text>
    <text x="682" y="1008" class="body">cov@60 alone does not penalize wrong joins.</text>
  </g>
  <g id="integration" data-box="1260 925 600 105">
    <text x="1282" y="954" font-size="15" font-weight="700" fill="#0f172a">NO DIRECT INTEGRATION</text>
    <text x="1282" y="981" class="body">Different stores, label rules and candidate units.</text>
    <text x="1282" y="1008" class="body">Adapt and benchmark before reusing scores.</text>
  </g>
  <text x="60" y="1060" font-size="15" fill="#94a3b8">Scope: workflow families are grouped; optional paths are marked. No claim of end-to-end superiority.</text>
</svg>